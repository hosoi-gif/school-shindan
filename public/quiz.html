<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スクール診断 | Life is Tech!</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<div class="app">

  <div id="screen-loading" class="card">
    <p style="color:var(--gray);">読み込み中...</p>
  </div>

  <div id="screen-error" class="card hidden">
    <div class="badge">エラー</div>
    <p style="color:var(--gray);">この会場が見つかりませんでした。URLを確認してください。</p>
  </div>

  <!-- スタート画面 -->
  <div id="screen-start" class="card hidden">
    <div class="badge">SCHOOL SHINDAN</div>
    <h1 id="startTitle"></h1>
    <p class="lead" id="startLead"></p>
    <button class="btn" id="startBtn" onclick="startQuiz()"></button>
  </div>

  <!-- 質問画面 -->
  <div id="screen-quiz" class="card hidden">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="qnum" id="qnum"></div>
    <div class="question" id="qtext"></div>
    <div id="choices"></div>
  </div>

  <!-- 結果画面 -->
  <div id="screen-result" class="card hidden">
    <div class="badge">診断結果</div>
    <div class="type-icon" id="resultIcon"></div>
    <div class="type-name" id="resultType"></div>
    <p class="type-quote" id="resultQuote"></p>
    <div class="course-name" id="resultCourseTag"></div>
    <p class="desc" id="resultDesc"></p>

    <div class="course-box">
      <div class="label">おすすめコース</div>
      <p id="resultCourseDesc"></p>
    </div>

    <div class="chart">
      <div class="section-title">📊 コース別 適性データ</div>
      <p style="font-size:11px;color:var(--gray);margin:-4px 0 12px;">6つの興味タイプの回答傾向から算出</p>
      <div id="chartRows"></div>
    </div>

    <div class="gallery-wrap">
      <div class="section-title">🎬 先輩の作品をチラ見せ（スワイプ↔️）</div>
      <div class="gallery-scroll" id="galleryScroll"></div>
      <div class="gallery-nav">
        <button onclick="scrollGallery(-1)">‹</button>
        <button onclick="scrollGallery(1)">›</button>
      </div>
    </div>

    <div class="cta">
      <p id="ctaMessage"></p>
      <p class="sub" id="ctaSub"></p>
      <div class="qr-slot" id="qrSlot">［ここにQRコード・URLを貼り付け］</div>
    </div>

    <button class="btn secondary" id="restartBtn" onclick="restartQuiz()"></button>
  </div>

  <footer>Life is Tech! Camp オリジナルコンテンツ</footer>
</div>

<script src="/quiz-engine.js"></script>
</body>
</html>
